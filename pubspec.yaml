name: brightacts_frontend_app
description: >
  Bright Acts is where technology meets kindness — inspiring positive change,
  one good act at a time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'  # Allows Dart 3.1.x CI environment

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2
  flutter_bloc: ^9.1.1

  # Firebase (compatible with Dart 3.1)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  firebase_app_check: ^0.3.0
  cloud_firestore: ^5.0.0

  # Web3 / Browser
  web3dart: ^2.6.1
  webview_flutter: ^4.8.0

  # Networking
  http: ^1.2.1
  dio: ^5.4.0

  # Authentication & Device
  local_auth: ^2.1.6

  # JSON
  json_annotation: ^4.9.0

  # Crypto & Security (older compatible versions)
  cryptography: ^2.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.2   # Works with Dart 3.1.x
  js: ^0.6.7

  flutter_secure_storage: ^9.2.4  # Latest working web/storage support :contentReference[oaicite:0]{index=0}

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  animated_digit: ^3.2.2
  qr_flutter: ^4.1.0
  confetti: ^0.8.0
  simple_animations: ^5.0.1
  flutter_animate: ^4.5.2
  flutter_syntax_view: ^4.0.0
  lottie: ^2.7.0

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.2
  logger: ^2.0.2+1

  # Images
  image_picker: ^1.0.4

  # Device Info & Connectivity
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0
  connectivity_plus: ^5.0.2

  # AI / ML (older version known compatible)
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.1   # Compatible with Dart 3.1.x
  json_serializable: ^6.7.1
  build_runner: ^2.4.9
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - config.env

  fonts:
    - family: Roboto
      fonts:
        # Add your font files here if desired
        # - asset: assets/fonts/Roboto-Regular.ttf
        # - asset: assets/fonts/Roboto-Bold.ttf
        #   weight: 700
