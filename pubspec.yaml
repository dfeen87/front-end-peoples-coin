name: brightacts_frontend_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web3dart: ^2.7.3 

  # UI & Utilities
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  animated_digit: ^3.2.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  flutter_dotenv: ^5.1.0
  confetti: ^0.7.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.2.0
  firebase_app_check: ^0.3.0

  # State Management
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^2.5.1

  # AI
  tflite_flutter: ^0.11.0
  
  # Crypto & Web
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  js: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
