name: brightacts_frontend_app
description: "Bright Acts is where technology meets kindness — inspiring positive change, one good act at a time."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web3dart: ^3.0.1 
  webview_flutter: ^4.8.0

  # UI & Utilities
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  animated_digit: ^3.2.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  flutter_dotenv: ^5.1.0
  confetti: ^0.8.0
  go_router: ^16.0.0 #

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_app_check: ^0.4.0
  # State Management
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^2.5.1

  # AI
  tflite_flutter: ^0.11.0
  
  # Crypto & Web
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  js: ^0.7.1
  flutter_animate: ^4.5.2
  flutter_syntax_view: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
