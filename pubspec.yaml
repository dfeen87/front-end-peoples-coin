name: brightacts_frontend_app
description: >
  Bright Acts is where technology meets kindness — inspiring positive change,
  one good act at a time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.1.3 <3.2.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: 2.4.10
  riverpod: 2.4.10
  provider: 6.0.5
  flutter_bloc: 9.1.1

  # Firebase (older 3.x versions that support Dart <3.2)
  firebase_core: 3.1.1
  firebase_auth: 5.6.4
  cloud_firestore: 5.0.2

  # **NO firebase_app_check** (requires SDK >=3.2 now)

  # Web3 / Blockchain
  web3dart: 2.6.1

  # HTTP & API — lower http version that supports Dart 3.1
  http: 1.0.0
  dio: 5.4.0

  # Local Authentication
  local_auth: 2.1.6

  # JSON
  json_annotation: 4.9.0

  # Crypto
  cryptography: 2.0.0
  encrypt: 5.0.3
  crypto: 3.0.3
  js: 0.6.7
  flutter_secure_storage: 9.2.4

  # UI
  cupertino_icons: 1.0.8
  go_router: 6.5.0    # older version compatible with Dart 3.1
  flutter_svg: 2.0.9
  cached_network_image: 3.3.0
  shimmer: 3.0.0
  animated_digit: 3.2.2
  qr_flutter: 4.1.0
  confetti: 0.8.0
  simple_animations: 5.0.1
  flutter_animate: 4.5.2
  flutter_syntax_view: 4.0.0
  lottie: 2.7.0

  shared_preferences: 2.2.2
  path_provider: 2.1.1

  # Utilities
  uuid: 3.0.6
  intl: 0.19.0
  url_launcher: 6.2.4
  flutter_dotenv: 5.1.2
  logger: 2.0.2+1

  image_picker: 1.0.4
  device_info_plus: 9.1.1
  package_info_plus: 4.2.0
  connectivity_plus: 5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 3.0.1
  json_serializable: 6.7.1
  build_runner: 2.4.9
  mockito: 5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - config.env

  fonts:
    - family: Roboto
      fonts:
        # - asset: assets/fonts/Roboto-Regular.ttf
        # - asset: assets/fonts/Roboto-Bold.ttf
        #   weight: 700
