name: brightacts_frontend_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.1

  # State Management
  # Note: You have both provider and riverpod. Usually only one is needed.
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^2.5.1

  # AI
  tflite_flutter: ^0.11.0

  # UI & Utilities
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  animated_digit: ^3.2.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  # The latest version of flutter_lints is 4.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
