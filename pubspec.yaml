name: brightacts_frontend_app
description: >
  Bright Acts is where technology meets kindness — inspiring positive change,
  one good act at a time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.10
  riverpod: ^2.4.10
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  
  # Firebase (compatible with Dart 3.1.3)
  firebase_core: ^2.31.1
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.4
  # Note: firebase_app_check excluded - requires SDK >=3.2.0
  
  # Web3 / Blockchain
  web3dart: ^2.7.3
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.3+1
  
  # Local Authentication
  local_auth: ^2.1.8
  
  # JSON
  json_annotation: ^4.8.1
  
  # Crypto
  cryptography: ^2.5.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  js: ^0.6.7
  flutter_secure_storage: ^9.0.0
  
  # UI
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  animated_digit: ^3.2.2
  qr_flutter: ^4.1.0
  confetti: ^0.7.0
  simple_animations: ^5.0.2
  flutter_animate: ^4.5.0
  flutter_syntax_view: ^4.0.0
  lottie: ^3.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3
  
  # Utilities
  uuid: ^4.4.0
  intl: ^0.18.1
  url_launcher: ^6.2.6
  flutter_dotenv: ^5.1.0
  logger: ^2.3.0
  image_picker: ^1.0.7
  device_info_plus: ^8.2.2
  package_info_plus: ^4.2.0
  connectivity_plus: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  json_serializable: ^6.7.1
  build_runner: ^2.4.9
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - config.env
  fonts:
    - family: Roboto
      fonts:
        # - asset: assets/fonts/Roboto-Regular.ttf
        # - asset: assets/fonts/Roboto-Bold.ttf
        #   weight: 700
