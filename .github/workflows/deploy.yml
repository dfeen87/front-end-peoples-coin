name: Deploy Bright Acts Frontend

on:
  push:
    branches:
      - main  # deploy when main branch is updated
  workflow_dispatch:  # allows manual trigger

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter (latest stable version compatible with Dart >=3.8.1)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '4.2.0'  # matches your Dart requirement

      # 3. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Build web
      - name: Build Flutter web
        run: flutter build web --release

      # 5. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live  # use 'live' for production
          projectId: brightacts-frontend-50f58
          public: build/web
