name: CI/CD - Bright Acts Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.20.5' # stable Flutter with Dart 3.8+

      # 3️⃣ Enable Flutter web
      - name: Enable Web Support
        run: flutter config --enable-web

      # 4️⃣ Install dependencies
      - name: Get Flutter Packages
        run: flutter pub get

      # 5️⃣ Build Web
      - name: Build Flutter Web
        run: flutter build web --release

      # 6️⃣ Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}" # optional for PR previews
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: brightacts-frontend-50f58
          target: hosting
          public: build/web
