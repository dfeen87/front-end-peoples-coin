name: Deploy BrightActs Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FLUTTER_ROOT: /opt/flutter
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter manually (stable channel, 3.20.5)
      - name: Install Flutter 3.20.5
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $FLUTTER_ROOT
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter --version
          flutter doctor

      # 3. Enable Flutter web
      - name: Enable Flutter Web
        run: flutter config --enable-web

      # 4. Install dependencies
      - name: Get Flutter packages
        run: flutter pub get

      # 5. Build web release
      - name: Build Flutter web
        run: flutter build web --release

      # 6. Setup Firebase CLI
      - name: Setup Firebase CLI
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: brightacts-frontend-50f58
          channelId: live
          public: build/web
          # Optional: keep previous deploys for rollback
          ignore: |
            **/.*  
