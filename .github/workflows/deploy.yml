name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8

      # 3️⃣ Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 4️⃣ Create .env file for secrets
      - name: Create .env file
        run: |
          echo "RECAPTCHA_SITE_KEY_PROD=${{ secrets.RECAPTCHA_SITE_KEY_PROD }}" > .env

      # 5️⃣ Build Flutter web
      - name: Build Flutter web
        run: flutter build web --release

      # 6️⃣ Verify web build directory exists
      - name: Verify web build
        run: ls -la build/web

      # 7️⃣ Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: brightacts-frontend-50f58
          channelId: live
          entryPoint: firebase
