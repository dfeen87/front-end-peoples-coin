name: Flutter Web CI/CD

on:
  push:
    branches:
      - main   # Deploy on main branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Flutter with compatible version (Dart 3.8+)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '4.2.0' 

      # 3️⃣ Enable Flutter web
      - name: Enable web support
        run: flutter config --enable-web

      # 4️⃣ Install dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5️⃣ Build Flutter web
      - name: Build Flutter Web
        run: flutter build web --release

      # 6️⃣ Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 7️⃣ Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}" 
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" 
          projectId: brightacts-frontend-50f58
          channelId: live  
          target: hosting
          public: build/web  
