name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main  # or your main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.8.1' # Use your Flutter version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web App
        run: flutter build web --release # This command generates the `build/web` directory

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRIGHTACTS_FRONTEND_50F58 }}'
          projectId: brightacts-frontend-50f58
          entryPoint: 'build/web' # This points the action to the correct directory
