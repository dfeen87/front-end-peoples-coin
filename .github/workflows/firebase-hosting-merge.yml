# Deploy a static site to Firebase Hosting on merge
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter specific setup (THIS SECTION IS CRITICAL)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2 # Action to set up Flutter SDK
        with:
          flutter-version: '3.32.7' # <--- YOUR EXACT FLUTTER VERSION HERE
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter web application
        run: flutter build web --release # Builds your Flutter web app

      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRIGHTACTS_FRONTEND }} # <-- Your new secret name
          channelId: live
          projectId: brightacts-frontend # <-- Your new Firebase Project ID
          # Ensure firebase.json's 'public' folder is correctly set to 'build/web'
