    <!-- Load Google reCAPTCHA Enterprise v3 with your site key -->
    <script
      src="https://www.google.com/recaptcha/enterprise.js?render=6LeE0pQrAAAAAML8x8JqtfryKhZ9bpvLRacQzH1F"

    ></script>

    <!-- Set serviceWorkerVersion to null to avoid JS errors -->
    <script>

  <body>
    <script src="flutter.js" defer></script>

    <!-- This is the crucial new script block for reCAPTCHA Enterprise -->
    <script>
        // The Flutter app will call this function to get a reCAPTCHA token.
        // It uses the Enterprise library and returns the token via a callback.
        function runRecaptcha(action) {
            grecaptcha.enterprise.ready(function() {
                grecaptcha.enterprise.execute(
                    '6LeE0pQrAAAAAML8x8JqtfryKhZ9bpvLRacQzH1F', { action: action }
                ).then(function(token) {
                    // Call the Dart callback function to return the token.
                    if (window.onRecaptchaSuccess) {
                        window.onRecaptchaSuccess(token);
                    }
                });
            });
        }
    </script>

    <script>
      window.addEventListener('load', function () {
        if (window._flutter && _flutter.loader) {
          _flutter.loader.loadEntrypoint({
            serviceWorker: {
              serviceWorkerVersion: serviceWorkerVersion,
            },
            onEntrypointLoaded: function (engineInitializer) {
              engineInitializer.initializeEngine().then(function (appRunner) {
                appRunner.runApp();
              });
            },
          });
        } else {
          console.error('_flutter.loader is not defined yet');
        }
      });
    </script>
