<!DOCTYPE html>
<html>
  <head>
    <base href="/" />

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="description" content="Record and explore acts of goodwill on the Bright Acts platform." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Bright Acts" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Bright Acts | A Goodwill Ledger</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Set serviceWorkerVersion to null to avoid JS errors -->
    <script>
      var serviceWorkerVersion = null;
    </script>
  </head>
  <body>
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        if (window._flutter && _flutter.loader) {
          _flutter.loader.loadEntrypoint({
            serviceWorker: {
              serviceWorkerVersion: serviceWorkerVersion,
            },
            onEntrypointLoaded: function (engineInitializer) {
              engineInitializer.initializeEngine().then(function (appRunner) {
                appRunner.runApp();
              });
            },
          });
        } else {
          console.error('_flutter.loader is not defined yet');
        }
      });
    </script>
  </body>
</html>
